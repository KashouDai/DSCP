services:
  mysql:
    image: mysql:8.0
    container_name: digital-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dop-digital
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/init_utf8.sh:/docker-entrypoint-initdb.d/00-init-utf8.sh:ro
      - ./backend/sql/dop_20260417.sql:/docker-entrypoint-initdb.d/source/01-dop-system.sql:ro
      - ./backend/sql/quartz.sql:/docker-entrypoint-initdb.d/source/02-quartz.sql:ro
      - ./backend/sql/digital_schema.sql:/docker-entrypoint-initdb.d/source/03-digital-schema.sql:ro
      - ./backend/sql/digital_init.sql:/docker-entrypoint-initdb.d/source/04-digital-init.sql:ro
      - ./backend/sql/demo_data.sql:/docker-entrypoint-initdb.d/source/05-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: digital-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/dop-digital?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      UPLOAD_PATH: /app/data/uploadPath
      AI_AGENT_KEY: ${AI_AGENT_KEY:-}
      AGENT_BASE_URL: http://agent:5000
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - upload-data:/app/data/uploadPath
      - backend-logs:/app/logs
      - ./docs/digital-sales-tools.json:/app/data/digital-sales-tools.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/captchaImage || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  agent:
    build:
      context: ../calligraph/agent-calligraph-hitl
      dockerfile: Dockerfile
    container_name: digital-agent
    restart: unless-stopped
    environment:
      model_api_key: ${DASHSCOPE_API_KEY:-${DEEPSEEK_API_KEY:-${MODEL_API_KEY:-}}}
      model_base_url: ${MODEL_BASE_URL:-https://maas.qianwenai.com/compatible-mode/v1}
      model_name: ${MODEL_NAME:-qwen3.7-flash-2026-07-15}
      MODEL_QUERY_PLAN_TIMEOUT_SECONDS: ${MODEL_QUERY_PLAN_TIMEOUT_SECONDS:-60}
      SECRET_KEY: ${AGENT_SECRET_KEY:-}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      local_mode: ${AGENT_LOCAL_MODE:-0}
      mongo_host: ${MONGO_HOST:-host.docker.internal}
      mongo_port: ${MONGO_PORT:-27017}
      mongo_db: ${MONGO_DB:-tools}
      milvus_uri: ${MILVUS_URI:-http://host.docker.internal:19530}
      milvus_db_name: ${MILVUS_DB_NAME:-tool_db}
      DIGITAL_SALES_GATEWAY_URL: ${DIGITAL_SALES_GATEWAY_URL:-http://backend:8080}
      DIGITAL_SALES_TOOLS_FILE: /app/catalog/digital-sales-tools.json
      TZ: Asia/Shanghai
    volumes:
      - ./docs/digital-sales-tools.json:/app/catalog/digital-sales-tools.json:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
    container_name: digital-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  upload-data:
  backend-logs:
